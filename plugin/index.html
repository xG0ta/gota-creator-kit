<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main id="autoframe-panel">
      <h1>Gota Creator Kit ☔</h1>
      <p class="muted">Selecciona clips de video en la secuencia.</p>

      <label>Formato
        <select id="aspect">
          <option value="0.5625">Vertical 9:16</option>
          <option value="1.7777778">Horizontal 16:9</option>
          <option value="1">Cuadrado 1:1</option>
        </select>
      </label>
      <label>Margen alrededor de la cara
        <input id="margin" type="range" min="0.8" max="1.8" value="1.25" step="0.05">
      </label>
      <label>Suavizado
        <input id="smoothing" type="range" min="0" max="0.95" value="0.75" step="0.05">
      </label>
      <label>Muestras por segundo
        <input id="sampleFps" type="number" min="0.2" max="15" value="2" step="0.2">
      </label>

      <button id="analyze">Analizar seleccion</button>
      <button id="apply" disabled>Aplicar (pendiente de validacion)</button>
      <progress id="progress" value="0" max="1"></progress>
      <pre id="status">Listo.</pre>
    </main>
    <script src="src/main.js"></script>
  </body>
</html>
